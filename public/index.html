<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>12 Semanas</title>
<meta name="description" content="Tu rutina de 12 semanas, armada por tu profe.">
<meta name="theme-color" content="#0a0a09">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="12 Semanas">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: señalética de gimnasio. Barra con cinta de precaución, gráfico de periodización como navegación de semanas, filas grandes tipo pizarra. */
:root{
  --bg:#0a0a09; --s1:#141412; --s2:#1c1c19; --line:#2c2b26; --fg:#f2efe4; --mute:#8f8b7c;
  --y:#ffd21a; --ink:#0a0a09; --ok:#8fe39b; --hot:#ff6a3d;
  --disp:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.nf{display:contents}.nf small{display:none}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tape{height:8px;background:repeating-linear-gradient(-45deg,var(--y) 0 12px,var(--ink) 12px 24px)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--ink)}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.mark .b{background:var(--y);color:var(--ink);padding:3px 7px 1px;transform:skewX(-10deg);display:inline-block}
.mark .b span{display:inline-block;transform:skewX(10deg)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);min-width:0}
.who .nm{color:var(--fg);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border:1px solid currentColor}
.tag.y{color:var(--y)}
main{padding-block:28px 120px}
h1,h2,h3{font-family:var(--disp);font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:.005em;margin:0;text-wrap:balance}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.lbl.y{color:var(--y)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--s2);padding:10px 16px;font-weight:600;font-size:14px;border-radius:0;transition:border-color .15s,transform .1s}
.btn:hover{border-color:var(--y)}
.btn:active{transform:translateY(1px)}
.btn.y{background:var(--y);color:var(--ink);border-color:var(--y);font-weight:700}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.ghost{background:transparent}
.btn.warn:hover{border-color:var(--hot);color:var(--hot)}
.ico{width:16px;height:16px;flex:none}

/* ---- Periodización: navegación de semanas ---- */
.peri{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:128px;padding-top:6px}
.wk{position:relative;border:0;padding:0;background:transparent;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-width:0}
.wk .col{position:relative;width:100%;background:var(--s2);border-top:3px solid var(--line);transition:background .2s,border-color .2s}
.wk .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--y) 32%,transparent)}
.wk .n{font-family:var(--disp);font-weight:900;font-size:20px;line-height:1;text-align:center;color:var(--mute)}
.wk:hover .col{border-top-color:var(--y)}
.wk.on .col{background:var(--y);border-top-color:var(--y)}
.wk.on .fill{background:rgba(0,0,0,.22)}
.wk.on .n{color:var(--y)}
.wk.now::after{content:"";position:absolute;top:-2px;left:50%;width:6px;height:6px;background:var(--hot);transform:translateX(-50%) rotate(45deg)}
.peri-legend{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--mute)}
.peri-legend i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:0}

/* ---- Login ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:24px}
.hero h1{font-size:clamp(64px,11vw,132px);line-height:.84}
.hero h1 em{font-style:normal;color:var(--y);display:block}
.hero p{max-width:44ch;color:var(--mute);font-size:16px}
.doors{display:flex;flex-direction:column;gap:10px}
.door{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;background:var(--s1);border:1px solid var(--line);padding:20px;transition:border-color .15s,background .15s}
.door:hover{border-color:var(--y);background:var(--s2)}
.door .k{font-family:var(--disp);font-weight:900;font-size:44px;line-height:.8;color:var(--y);width:44px}
.door strong{font-family:var(--disp);font-weight:900;font-size:26px;text-transform:uppercase;display:block;line-height:1}
.door .arr{font-family:var(--disp);font-size:28px;color:var(--y);transition:transform .15s}
.door:hover .arr{transform:translateX(4px)}
.note{border-left:3px solid var(--y);padding-left:12px;font-size:13px;color:var(--mute)}

/* ---- Alumno ---- */
.weekhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:end}
.bignum{font-family:var(--disp);font-weight:900;font-size:clamp(96px,18vw,170px);line-height:.78;color:transparent;-webkit-text-stroke:2px var(--y);letter-spacing:-.02em}
.weekhead h1{font-size:clamp(40px,7vw,64px)}
.phasepill{display:inline-block;background:var(--y);color:var(--ink);font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:18px;padding:3px 10px 1px;transform:skewX(-10deg)}
.meter{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.meter>div{padding:14px 16px;border-right:1px solid var(--line)}
.meter>div:last-child{border-right:0}
.meter .v{font-family:var(--disp);font-weight:900;font-size:40px;line-height:.9}
.meter .v small{font-size:20px;color:var(--mute)}
.daylist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.dayrow{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 4px;transition:background .15s}
.dayrow:hover{background:var(--s1)}
.dayrow .d{font-family:var(--disp);font-weight:900;font-size:52px;line-height:.8;color:var(--mute)}
.dayrow .d small{font-size:15px;display:block;letter-spacing:.06em;line-height:1;margin-bottom:4px}
.dayrow .t{font-weight:600;font-size:16px}
.dayrow .sub{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow.today .d{color:var(--y)}
.dayrow.done .d{color:var(--fg)}
.st{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--line);white-space:nowrap}
.st.today{background:var(--y);color:var(--ink);border-color:var(--y)}
.st.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.lockline{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}

.ex{border:1px solid var(--line);background:var(--s1);padding:16px;display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 14px;transition:border-color .2s}
.ex.done{border-color:color-mix(in srgb,var(--y) 55%,var(--line))}
.ex .i{font-family:var(--disp);font-weight:900;font-size:40px;line-height:.85;color:var(--mute);grid-row:span 3}
.ex.done .i{color:var(--y)}
.ex .nm{font-weight:700;font-size:17px;line-height:1.2}
.ex .rx{font-family:var(--mono);font-size:13px;color:var(--mute)}
.ex .rx b{color:var(--fg);font-weight:600}
.ex .tip{font-size:13px;color:var(--mute);border-left:2px solid var(--line);padding-left:8px;margin-top:4px}
.ctrl{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-top:12px}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.set{width:44px;height:44px;border:2px solid var(--line);background:transparent;font-family:var(--disp);font-weight:900;font-size:20px;color:var(--mute);display:grid;place-items:center;transition:background .15s,border-color .15s,color .15s,transform .15s}
.set:hover{border-color:var(--y)}
.set.on{background:var(--y);border-color:var(--y);color:var(--ink)}
.set.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line)}
.stepper button{width:40px;border:0;background:var(--s2);font-size:18px;font-weight:700}
.stepper button:hover{color:var(--y)}
.stepper input{width:72px;text-align:center;background:var(--bg);border:0;border-inline:1px solid var(--line);font-family:var(--mono);font-weight:600;font-size:15px;padding:10px 4px}
.stepper span{padding:0 10px 0 0;font-family:var(--mono);font-size:12px;color:var(--mute);background:var(--bg);display:flex;align-items:center}
.stepper input{border-right:0}
.sug{font-family:var(--mono);font-size:12px;color:var(--ok)}
.stamp{border:3px solid var(--y);color:var(--y);font-family:var(--disp);font-weight:900;font-size:34px;text-transform:uppercase;text-align:center;padding:14px;transform:rotate(-1.5deg)}
.stamp.in{animation:stamp .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(1.6) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(-1.5deg);opacity:1}}

.rest{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--y);color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(110%);transition:transform .25s ease-out}
.rest.show{transform:none;visibility:visible}
.rest:not(.show){visibility:hidden;transition:transform .25s ease-out,visibility 0s .25s}
.rest .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.rest .t{font-family:var(--disp);font-weight:900;font-size:44px;line-height:.9;font-variant-numeric:tabular-nums;min-width:3.2ch}
.rest .bar{flex:1;height:6px;background:rgba(0,0,0,.18);position:relative;min-width:40px}
.rest .bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.rest button{background:var(--ink);color:var(--y);border:0;padding:8px 12px;font-weight:700;font-size:13px}
.rest .opts{display:flex;gap:4px}
.rest .opts button{background:transparent;color:var(--ink);border:1px solid rgba(0,0,0,.35);padding:6px 8px;font-family:var(--mono);font-size:12px}

/* ---- Profesor ---- */
.roster{border-top:1px solid var(--line)}
.rrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 96px 24px;gap:18px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:16px 4px;transition:background .15s}
.rrow:hover{background:var(--s1)}
.rrow:hover .go{color:var(--y);transform:translateX(3px)}
.rrow .nm{font-family:var(--disp);font-weight:900;font-size:30px;text-transform:uppercase;line-height:.95}
.rrow .goal{font-size:13px;color:var(--mute)}
.mini{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;align-items:end;height:34px}
.mini i{display:block;background:var(--s2);position:relative}
.mini i.dn{background:var(--y)}
.mini i.cur{background:var(--hot)}
.pct{font-family:var(--disp);font-weight:900;font-size:36px;text-align:right;line-height:.9}
.pct small{font-size:16px;color:var(--mute)}
.go{font-family:var(--disp);font-size:24px;color:var(--mute);transition:transform .15s,color .15s}
.drawer{border:1px solid var(--y);background:var(--s1);padding:18px}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 200px;min-width:0}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);padding:10px 12px;border-radius:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--y);outline:none}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:transparent;border:0;padding:12px 0;font-family:var(--disp);font-weight:700;font-size:20px;text-transform:uppercase;color:var(--mute);border-bottom:4px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--y)}
.daytabs{display:flex;gap:0;border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
.dt{border:0;border-right:1px solid var(--line);background:transparent;padding:8px 16px;font-family:var(--disp);font-weight:900;font-size:18px;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.dt:last-child{border-right:0}
.dt.on{background:var(--y);color:var(--ink)}
.dt .ok{color:var(--ok);margin-left:4px}
.dt.on .ok{color:var(--ink)}
.edhead{display:grid;grid-template-columns:44px minmax(0,2.2fr) 64px 64px 72px 60px minmax(0,1.6fr) 92px 70px;gap:8px;padding:0 8px 6px;border-bottom:1px solid var(--line)}
.edrow{display:grid;grid-template-columns:44px minmax(0,2.2fr) 64px 64px 72px 60px minmax(0,1.6fr) 92px 70px;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.edrow:hover{background:var(--s1)}
.edrow .k{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--mute)}
.edrow input{width:100%;min-width:0;background:transparent;border:1px solid transparent;padding:7px 8px;border-radius:0}
.edrow input:hover{border-color:var(--line)}
.edrow input:focus{border-color:var(--y);background:var(--bg);outline:none}
.edrow input.n{font-family:var(--mono);text-align:center;padding-inline:2px}
.edrow input.name{font-weight:600}
.vol{font-family:var(--mono);font-size:13px;color:var(--mute);text-align:center}
.alog{font-family:var(--mono);font-size:12px;white-space:nowrap}
.acts{display:flex;gap:2px;justify-content:flex-end}
.acts button{width:30px;height:30px;border:1px solid transparent;background:transparent;color:var(--mute);display:grid;place-items:center}
.acts button:hover{border-color:var(--line);color:var(--fg)}
.acts button.x:hover{color:var(--hot);border-color:var(--hot)}
.edrow.new{animation:flash .9s ease-out}
@keyframes flash{0%{background:color-mix(in srgb,var(--y) 25%,transparent)}100%{background:transparent}}
.weekbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--s1);border:1px solid var(--line);padding:10px 12px}
.weekbar select{background:var(--bg);border:1px solid var(--line);padding:7px 10px;font-weight:600}
.perm{border:1px solid var(--line)}
.perm .r{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.perm .r:last-child{border-bottom:0}
.perm .r.h{background:var(--s1)}
.yes{color:var(--y);font-weight:700}
.nope{color:var(--mute)}
.lifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lift{border:1px solid var(--line);background:var(--s1);padding:14px}
.lift .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.lift .row{flex-wrap:nowrap}
.lift svg{width:100%;height:70px;display:block;margin-top:8px}
.lift .delta{font-family:var(--disp);font-weight:900;font-size:28px;line-height:1}
.wkpct{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;align-items:end;height:110px}
.wkpct div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;align-items:stretch;min-width:0}
.wkpct i{display:block;background:var(--y)}
.wkpct span{font-family:var(--mono);font-size:10px;color:var(--mute);text-align:center}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--hot);padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--ink);padding:10px 16px;font-weight:700;font-size:14px;z-index:20}

@media (max-width:820px){
  .hero{grid-template-columns:minmax(0,1fr);gap:24px}
  .edhead{display:none}
  .edrow{grid-template-columns:44px repeat(4,minmax(0,1fr)) 70px;padding:12px 4px}
  .edrow .k{grid-row:span 3}
  .edrow input.name{grid-column:2/-1}
  .edrow .vol{display:none}
  .nf{display:flex;flex-direction:column;gap:2px;min-width:0}.nf small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center}
  .edrow .nf input.n{border-color:var(--line)}
  .edrow input.tip{grid-column:2/-1}
  .edrow .alog{grid-column:2/5}
  .edrow .acts{grid-column:5/-1}
}
@media (max-width:560px){
  main{padding-block:20px 120px}
  .peri{height:96px;gap:3px}
  .wk .n{font-size:15px}
  .meter .v{font-size:30px}
  .meter>div{padding:10px}
  .dayrow{grid-template-columns:56px minmax(0,1fr) auto;gap:12px}
  .dayrow .d{font-size:42px}
  .rrow{grid-template-columns:minmax(0,1fr) 72px 20px;gap:12px}
  .rrow .mini{grid-column:1/-1;grid-row:2}
  .who .nm{display:none}
  .daytabs{width:100%}
  .dt{flex:1;padding:8px 6px;font-size:16px}
  .perm .r{grid-template-columns:minmax(0,1fr) 74px 84px;gap:8px;padding:10px}
  .perm .r.h{font-size:10px;letter-spacing:.04em}
  .weekhead{gap:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3: formas suaves ===== */
:root{--r:18px;--r-sm:12px}
.mark .b{transform:none;border-radius:8px;padding:3px 8px 1px}.mark .b span{transform:none}
.tape{height:4px;background:var(--y)}
.tag{border-radius:999px;padding:3px 9px}
.btn{border-radius:999px;padding:10px 18px}
.btn.sm{padding:7px 13px}
.door{border-radius:var(--r)}
.note{border-left:0;background:var(--s1);border-radius:var(--r-sm);padding:12px 14px}
.phasepill{transform:none;border-radius:999px;font-size:16px;padding:4px 12px 2px}
.meter{border:0;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.meter>div{background:var(--s1);border:0;border-radius:var(--r-sm)}
.peri{gap:5px}
.wk .col{border-radius:8px 8px 4px 4px;border-top-width:0;box-shadow:inset 0 3px 0 0 var(--pc,var(--line))}
.wk .fill{border-radius:inherit}
.wk.on .col{box-shadow:none}
.daylist{border-top:0;gap:8px}
.dayrow{background:var(--s1);border:1px solid transparent;border-radius:var(--r);padding:14px 16px}
.dayrow:hover{background:var(--s2)}
.dayrow.today{border-color:var(--y)}
.st{border-radius:999px;padding:5px 10px}
.bignum{-webkit-text-stroke:1.5px var(--y)}
/* tarjeta de ejercicio */
.ex{display:flex;flex-direction:column;gap:14px;border-radius:22px;padding:18px;background:var(--s1);border:1px solid var(--line)}
.ex.done{border-color:color-mix(in srgb,var(--y) 60%,transparent);background:color-mix(in srgb,var(--y) 5%,var(--s1))}
.ex-top{display:flex;gap:14px;align-items:flex-start}
.ex-n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--s2);color:var(--y);display:grid;place-items:center;font-family:var(--disp);font-weight:900;font-size:20px;margin-top:2px}
.ex.done .ex-n{background:var(--y);color:var(--ink)}
.ex-name{font-family:var(--body);text-transform:none;font-weight:700;font-size:22px;line-height:1.15;letter-spacing:-.01em}
.ex-rx{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{background:var(--s2);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.vid{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--fg);text-decoration:none;font-size:11px;line-height:1.15;text-align:center;font-weight:600}
.vid .ico{width:44px;height:44px;padding:13px 12px 13px 14px;border-radius:50%;background:var(--s2);color:var(--y);transition:background .15s,color .15s}
.vid:hover .ico{background:var(--y);color:var(--ink)}
.tip{display:flex;gap:8px;align-items:flex-start;border:0;margin:0;padding:10px 12px;background:var(--s2);border-radius:var(--r-sm);font-size:14px;color:var(--fg)}
.tip .ico{color:var(--y);margin-top:2px}
.weights{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rec,.used{border-radius:16px;padding:12px 14px;min-width:0}
.rec{background:var(--y);color:var(--ink)}
.rec.none{background:var(--s2);color:var(--fg)}
.used{background:var(--s2)}
.rec-l{font-size:12px;font-weight:600;letter-spacing:.02em;opacity:.75}
.rec-v{font-family:var(--disp);font-weight:900;font-size:48px;line-height:.95;margin-top:2px;font-variant-numeric:tabular-nums}
.rec-v small{font-size:20px;margin-left:3px}
.rec-s{font-size:12px;opacity:.75}
.used .stepper{margin-top:8px;border:0;background:var(--bg);border-radius:999px;overflow:hidden;width:100%}
.used .stepper button{width:38px;height:48px;background:transparent;font-size:22px;flex:none}
.used .stepper input{flex:1;width:0;min-width:0;border:0;background:transparent;font-family:var(--disp);font-weight:900;font-size:26px;padding:0;text-align:center}
.used .stepper input::placeholder{color:var(--mute);opacity:.6}
.setsrow{display:flex;flex-direction:column;gap:8px}
.sets{gap:8px}
.set{width:52px;height:52px;border-radius:50%;font-size:20px;border-width:2px}
.set.on{font-size:22px}
.stamp{border-radius:var(--r);transform:none}
@keyframes stamp{0%{transform:scale(1.3);opacity:0}100%{transform:scale(1);opacity:1}}
.rest{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));border-radius:22px;padding-bottom:0;box-shadow:0 10px 40px rgba(0,0,0,.5);transform:translateY(140%)}
.rest .wrap{padding-left:18px;padding-right:18px}
.rest .bar{border-radius:99px;overflow:hidden}
.rest button{border-radius:999px;padding:9px 14px}
.rest .opts button{border-radius:999px}
/* profesor */
.roster{border-top:0;display:flex;flex-direction:column;gap:8px}
.rrow{background:var(--s1);border-radius:var(--r);padding:16px 18px}
.rrow:hover{background:var(--s2)}
.mini i{border-radius:3px 3px 1px 1px}
.drawer{border-radius:var(--r)}
.field input,.field select,.field textarea{border-radius:var(--r-sm)}
.tab{font-family:var(--body);text-transform:none;font-size:15px;font-weight:600;border-bottom-width:3px}
.daytabs{border:0;background:var(--s1);border-radius:999px;padding:4px;gap:2px}
.dt{border:0;border-radius:999px;font-family:var(--body);text-transform:none;font-weight:600;font-size:14px;padding:8px 16px}
.weekbar{border-radius:var(--r);border:0}
.weekbar select{border-radius:999px;padding:7px 14px}
.edrow{border-radius:var(--r-sm);border-bottom:0;margin-top:4px;background:var(--s1)}
.edrow:hover{background:var(--s2)}
.edhead{border-bottom:0}
.edrow input{border-radius:10px}
.acts button{border-radius:50%}
.perm{border:0;background:var(--s1);border-radius:var(--r);overflow:hidden}
.perm .r.h{background:var(--s2)}
.lift{border:0;border-radius:var(--r)}
.wkpct i{border-radius:6px 6px 2px 2px}
.confirm{border-radius:var(--r-sm)}
.toast{border-radius:999px;padding:10px 20px}
@media (max-width:560px){
  .ex{padding:16px;border-radius:20px}
  .ex-name{font-size:20px}
  .rec-v{font-size:42px}
  .weights{gap:8px}
  .edrow{padding:12px 10px}
}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--y);color:var(--ink);border:0;border-radius:22px;padding:18px 20px;transition:transform .12s}
.cta:active{transform:scale(.99)}
.cta-l{display:block;font-size:13px;font-weight:600;opacity:.7}
.cta-t{display:block;font-family:var(--disp);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1}
.cta-a{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;font-size:22px;flex:none}
@media (max-width:360px){.weights{grid-template-columns:minmax(0,1fr)}}

/* ===== v4: nuevas funciones ===== */
.has-nav main{padding-bottom:150px}
.has-nav .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.has-nav .rest{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.bnav{position:fixed;z-index:7;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;background:rgba(28,28,25,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:calc(100% - 24px)}
.bnav button{border:0;background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:7px;white-space:nowrap}
.bnav button.on{background:var(--y);color:var(--ink)}
.bnav .dot{width:7px;height:7px;border-radius:50%;background:var(--hot)}
.seg{display:inline-flex;background:var(--s1);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--y);color:var(--ink)}
.card{background:var(--s1);border-radius:var(--r);padding:16px}
.card h3{font-family:var(--body);text-transform:none;font-weight:700;font-size:17px;line-height:1.2}
.sec-t{font-size:clamp(26px,4vw,32px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
/* comentarios */
.cbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--mute);font-weight:600;font-size:14px;padding:4px 0}
.cbtn:hover{color:var(--y)}
.cbtn .n{background:var(--y);color:var(--ink);border-radius:999px;font-size:11px;padding:1px 7px}
.thread{display:flex;flex-direction:column;gap:6px}
.bub{max-width:85%;padding:9px 12px;border-radius:16px;font-size:14px;line-height:1.35}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:3px}
.bub.me{align-self:flex-end;background:color-mix(in srgb,var(--y) 18%,var(--s2));border-bottom-right-radius:5px}
.bub.them{align-self:flex-start;background:var(--s2);border-bottom-left-radius:5px}
.bub .who{font-size:11px;font-weight:700;opacity:.8;display:block;margin-bottom:2px}
.compose{display:flex;gap:8px;align-items:flex-end}
.compose textarea{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:10px 14px;resize:none;font-size:14px}
.compose textarea:focus{border-color:var(--y);outline:none}
.compose button{flex:none}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mute)}
.quick button:hover{border-color:var(--y);color:var(--fg)}
/* récord */
.pr{display:inline-flex;align-items:center;gap:5px;background:var(--y);color:var(--ink);border-radius:999px;padding:4px 10px 4px 6px;font-size:12px;font-weight:700}
.pr .ico{width:16px;height:16px}
.pr.in{animation:pop .45s ease-out}
.recs{display:flex;flex-direction:column;gap:8px}
.recrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--s1);border-radius:16px;padding:12px 14px}
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s2);color:var(--mute)}
.medal.g{background:var(--y);color:var(--ink)}
.medal .ico{width:20px;height:20px}
.recrow .kg{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1;text-align:right;white-space:nowrap}
.recrow .kg small{font-size:14px;color:var(--mute)}
.up{font-family:var(--mono);font-size:12px;color:var(--ok);display:block;text-align:right}
/* RPE */
.rpe{display:flex;flex-direction:column;gap:12px;background:var(--s1);border-radius:22px;padding:18px}
.rpe-scale{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.rpe-scale button{aspect-ratio:1;max-width:100%;border:0;border-radius:50%;font-family:var(--disp);font-weight:900;font-size:18px;background:var(--s2);color:var(--fg);transition:transform .12s,background .15s}
.rpe-scale button:hover{transform:scale(1.08)}
.rpe-scale button.on{background:var(--y);color:var(--ink);transform:scale(1.1)}
.rpe-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.rpe-l{font-weight:700;color:var(--y)}
.rpebars{display:flex;gap:4px;align-items:flex-end;height:90px;overflow-x:auto;padding-bottom:2px}
.rpebars div{flex:0 0 18px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
.rpebars i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--y)}
.rpebars i.hi{background:var(--hot)}
.rpebars span{font-family:var(--mono);font-size:9px;color:var(--mute)}
/* constancia */
.streak{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.streak>div{background:var(--s1);border-radius:16px;padding:14px}
.streak .v{font-family:var(--disp);font-weight:900;font-size:40px;line-height:.9}
.streak .v.y{color:var(--y)}
.streak .l{font-size:12px;color:var(--mute);margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:440px}
.cal .h{font-family:var(--mono);font-size:10px;color:var(--mute);text-align:center;text-transform:uppercase}
.cal .c{aspect-ratio:1;border-radius:10px;background:var(--s1);display:grid;place-items:center;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.cal .c.t{background:var(--y);color:var(--ink);font-weight:700}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--fg);color:var(--fg)}
.cal .c.fut{opacity:.35}
/* recordatorio */
.remind{display:flex;flex-direction:column;gap:12px;background:var(--s1);border-radius:var(--r);padding:14px 16px}
.remind .row{flex-wrap:nowrap}
.bell{width:40px;height:40px;border-radius:50%;background:var(--s2);color:var(--y);display:grid;place-items:center;flex:none}
.switch{position:relative;width:48px;height:28px;border-radius:999px;background:var(--s2);border:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:transform .18s,background .15s}
.switch.on{background:var(--y)}
.switch.on::after{transform:translateX(20px);background:var(--ink)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;font-weight:700;font-size:13px;color:var(--mute)}
.chips button.on{background:var(--y);border-color:var(--y);color:var(--ink)}
.timein{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-family:var(--mono)}
.notif{display:flex;gap:12px;align-items:flex-start;background:rgba(242,239,228,.08);border-radius:18px;padding:12px 14px;max-width:380px}
.notif .app{width:36px;height:36px;border-radius:10px;background:var(--y);color:var(--ink);display:grid;place-items:center;font-family:var(--disp);font-weight:900;flex:none}
.notif b{display:block;font-size:14px}
.notif span{font-size:13px;color:var(--mute)}
/* medidas */
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mstat{background:var(--s1);border-radius:16px;padding:12px 14px}
.mstat .v{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1}
.mstat .v small{font-size:14px;color:var(--mute);margin-left:2px}
.mstat .d{font-family:var(--mono);font-size:12px}
.mstat .l{font-size:12px;color:var(--mute)}
.dn{color:var(--ok)} .upc{color:var(--hot)}
.chart{background:var(--s1);border-radius:var(--r);padding:14px 16px}
.chart svg{width:100%;height:auto;display:block}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.photo{border-radius:16px;overflow:hidden;background:var(--s1);position:relative;aspect-ratio:3/4}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:8px;bottom:8px;background:rgba(10,10,9,.75);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600}
.photo.empty{display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;padding:12px;border:1px dashed var(--line);background:transparent}
.mtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
.mtable th,.mtable td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
.mtable th{font-family:var(--mono);font-size:11px;color:var(--mute);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.mtable th:first-child,.mtable td:first-child{text-align:left}
.scroll{overflow-x:auto}
.filein{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;font-size:14px;color:var(--mute)}
.filein:hover{border-color:var(--y);color:var(--fg)}
.filein input{position:absolute;opacity:0;width:1px;height:1px}
.filein img{width:44px;height:58px;object-fit:cover;border-radius:8px}
.due{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;background:var(--s2)}
.due.now{background:var(--y);color:var(--ink)}
/* avisos profe */
.alerts{display:flex;flex-direction:column;gap:6px}
.alert{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:var(--s1);border-radius:16px;padding:12px 14px;transition:background .15s}
.alert:hover{background:var(--s2)}
.alert .ai{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--s2)}
.alert .ai .ico{width:18px;height:18px}
.alert.hot .ai{background:color-mix(in srgb,var(--hot) 22%,transparent);color:var(--hot)}
.alert.y .ai{background:color-mix(in srgb,var(--y) 22%,transparent);color:var(--y)}
.alert.ok .ai{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.alert b{font-weight:700}
.alert .sub{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert .go{font-size:20px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.bd{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--s2);color:var(--mute)}
.bd.hot{background:color-mix(in srgb,var(--hot) 20%,transparent);color:var(--hot)}
.bd.y{background:color-mix(in srgb,var(--y) 20%,transparent);color:var(--y)}
.bd.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.cchip{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--y);color:var(--ink);border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;margin-left:6px}
.cchip .ico{width:12px;height:12px}
/* pagos */
.billtop{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.billtop>div{background:var(--s1);border-radius:16px;padding:14px}
.billtop .v{font-family:var(--disp);font-weight:900;font-size:30px;line-height:1}
.billtop .l{font-size:12px;color:var(--mute);margin-bottom:6px}
.pbar{height:8px;border-radius:99px;background:var(--s2);overflow:hidden;margin-top:10px}
.pbar i{display:block;height:100%;background:var(--y);border-radius:99px}
.pbar i.hot{background:var(--hot)}
.pays{display:flex;flex-direction:column;gap:6px}
.pay{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--s1);border-radius:14px;padding:12px 14px}
.pay .amt{font-family:var(--disp);font-weight:900;font-size:24px}
/* plantillas */
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.tpl{background:var(--s1);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.tpl .nm{font-family:var(--disp);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1}
.tplname{font-family:var(--disp);font-weight:900;font-size:clamp(36px,7vw,64px);text-transform:uppercase;background:transparent;border:1px solid transparent;border-radius:var(--r-sm);padding:0 8px;margin-left:-8px;width:100%;line-height:1.05}
.tplname:hover{border-color:var(--line)}
.tplname:focus{border-color:var(--y);outline:none}
@media (max-width:560px){
  .bnav button{padding:10px 14px}
  .streak .v{font-size:32px}
  .alert{grid-template-columns:32px minmax(0,1fr) auto;gap:10px;padding:11px 12px}
  .rpe-scale{gap:3px}
  .rpe-scale button{font-size:15px}
}

/* ===== miniaturas ===== */
.th{display:inline-grid;place-items:center;flex:none;width:72px;height:72px;border-radius:16px;background:var(--s2);color:var(--fg);--eq:var(--y);--gr:var(--mute);overflow:hidden}
.th svg{width:82%;height:82%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th.md{width:40px;height:40px;border-radius:11px}
.th.md svg{stroke-width:3}
.th.sm{width:30px;height:30px;border-radius:8px;--gr:transparent}
.th.sm svg{stroke-width:3.4}
.thw{position:relative;flex:none}
.thw .ex-n{position:absolute;top:-6px;left:-6px;width:24px;height:24px;font-size:14px;margin:0;border:2px solid var(--s1)}
.ex.done .thw .th{background:color-mix(in srgb,var(--y) 16%,var(--s2))}
.ths{display:flex;gap:4px;margin:6px 0 4px;overflow:hidden}
.dayrow.done .ths .th{opacity:.55}
.kpic{position:relative;border:0;background:transparent;padding:0;border-radius:11px;width:40px;height:40px}
.kpic span{position:absolute;right:-5px;bottom:-5px;min-width:18px;height:18px;border-radius:999px;background:var(--bg);color:var(--mute);font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.kpic:hover .th{box-shadow:0 0 0 2px var(--y)}
.picker{background:var(--s2);border-radius:var(--r);padding:14px;margin:6px 0 8px;display:flex;flex-direction:column;gap:12px}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.picgrid button{display:flex;flex-direction:column;align-items:center;gap:5px;border:1px solid transparent;background:var(--s1);border-radius:14px;padding:8px 4px;font-size:11px;color:var(--mute);line-height:1.2;text-align:center}
.picgrid button:hover{border-color:var(--line);color:var(--fg)}
.picgrid button.on{border-color:var(--y);color:var(--fg)}
@media (max-width:560px){.th{width:64px;height:64px;border-radius:14px}.thw .ex-n{width:22px;height:22px;font-size:13px}}
@media (max-width:820px){.edrow .kpic{grid-row:span 3}}

.th.none{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--mute)}
.th img{background:var(--s2)}
.picgrid .th.md{width:56px;height:56px}

.seg.full{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
.seg.full button{padding:11px 8px;font-size:15px}
body:has(.rest.show) .toast{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.stack>.field{flex:none}
.runrow{grid-template-columns:minmax(0,1fr) 70px!important;align-items:start}
.runrow .runb{grid-column:1/-1;display:flex;gap:8px;align-items:center;color:var(--y)}
.runrow textarea{grid-column:1/2;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;resize:vertical;min-height:96px;line-height:1.5}
.runrow textarea:focus{border-color:var(--y);outline:none}
.runtxt{background:var(--s2);border-radius:var(--r-sm);padding:14px 16px;font-size:16px;line-height:1.7}
.runic{color:var(--y)}.runic .ico{width:34px;height:34px}
html,body{overflow-x:clip;max-width:100%;overscroll-behavior-x:none}
body{touch-action:pan-y pinch-zoom}
@media (max-width:820px){input,select,textarea{font-size:16px!important}}
.seg.six{grid-template-columns:repeat(3,minmax(0,1fr));border-radius:24px}
.seg.six button{position:relative}
.ndot{position:absolute;top:7px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--hot)}
.seg.six button.on .ndot{background:var(--ink)}
.tseg{align-self:flex-start;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tseg button{white-space:nowrap}
.yt{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;border-radius:16px;overflow:hidden;background:#000}
.yt img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85}
.yt iframe{width:100%;height:100%;border:0;display:block}
.ytp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:var(--y);color:var(--ink);display:grid;place-items:center}
.ytp .ico{width:24px;height:24px;margin-left:3px}
.meal{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:var(--s1);border-radius:var(--r);padding:16px}
.meal .mt{font-family:var(--disp);font-weight:900;font-size:22px;color:var(--y);line-height:1.1}
.meal h3{font-family:var(--body);text-transform:none;font-weight:700;font-size:17px}
.meal p{margin:6px 0 0;color:var(--fg);line-height:1.5}
.mealed{background:var(--s1);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.mealed input,.mealed textarea{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;min-width:0}
.mealed input:focus,.mealed textarea:focus{border-color:var(--y);outline:none}
.mealed .mn{flex:1;font-weight:700}
.mealed .mtm{width:120px;flex:none}
.mealed textarea{resize:vertical}
.rw{background:var(--s1);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid transparent}
.rw.won{border-color:color-mix(in srgb,var(--y) 55%,transparent);background:color-mix(in srgb,var(--y) 6%,var(--s1))}
.rw-p{font-weight:700;font-size:17px;line-height:1.25}
.mind h3{font-family:var(--body);text-transform:none;font-weight:700;font-size:19px;line-height:1.2}
#lf{max-width:460px;width:100%;justify-self:end}
@media (max-width:820px){#lf{justify-self:stretch;max-width:none}}
.btn:disabled{opacity:.55;pointer-events:none}
a.btn{text-decoration:none;color:inherit}a.btn.y{color:var(--ink)}

</style>

async function API(path,opt={}){
  const r=await fetch('/api/'+path,{method:opt.method||(opt.body?'POST':'GET'),headers:opt.body?{'content-type':'application/json'}:{},body:opt.body?JSON.stringify(opt.body):undefined,credentials:'same-origin',keepalive:!!opt.keepalive});

  return j;
}
const isO=x=>x!==null&&typeof x==='object';
const sameItem=(x,y)=>isO(x)&&isO(y)?(!Array.isArray(x)&&!Array.isArray(y)&&(x.id??null)===(y.id??null)):x===y;
function dif(a,b,p,out){
  if(a===b)return;
  if(isO(a)&&isO(b)&&Array.isArray(a)===Array.isArray(b)){
    if(Array.isArray(a)){
      if(b.length>=a.length&&a.every((x,i)=>sameItem(x,b[i]))){a.forEach((x,i)=>dif(x,b[i],[...p,i],out));for(let i=a.length;i<b.length;i++)out.push({op:'push',p,v:b[i]});return}
      if(JSON.stringify(a)!==JSON.stringify(b))out.push({op:'set',p,v:b});return}
    for(const k in b){if(b[k]===undefined)continue;if(a[k]===undefined)out.push({op:'set',p:[...p,k],v:b[k]});else dif(a[k],b[k],[...p,k],out)}
    for(const k in a)if(a[k]!==undefined&&b[k]===undefined)out.push({op:'del',p:[...p,k]});
    return}
  if(JSON.stringify(a)!==JSON.stringify(b))out.push({op:'set',p,v:b});
}
function opsFor(A0,B0){
  const ops=[];
  for(const[k,list]of[['s','students'],['t','templates']]){
    const A=new Map(A0[list].map(x=>[x.id,x])),B=new Map(B0[list].map(x=>[x.id,x]));
    for(const[id,b]of B){const a=A.get(id);if(!a){ops.push({k,id,op:'put',p:[],v:b});continue}const o=[];dif(a,b,[],o);o.forEach(x=>ops.push({k,id,...x}))}
    for(const id of A.keys())if(!B.has(id))ops.push({k,id,op:'remove',p:[]});
  }
  if(A0.content&&B0.content){const o=[];dif(A0.content,B0.content,[],o);o.forEach(x=>ops.push({k:'c',id:'main',...x}))}
  return ops;
}

async function flush(keepalive){
  clearTimeout(syncT);
  if(!ME)return;
  if(syncing){again=true;return}
  const cur=clone(db),ops=opsFor(snap,cur);
  if(!ops.length)return;
  syncing=true;
  try{await API('ops',{body:{ops},keepalive:keepalive===true});snap=cur;offT=0;keep()}
  catch(e){
    if(e.status===401)return;
    if(e.status>=400&&e.status<500&&e.status!==429){toast(e.message);syncing=false;await refresh(true);return}
    if(!offT||Date.now()-offT>20000){toast('Sin conexión. Se guarda cuando vuelva.');offT=Date.now()}
    syncT=setTimeout(flush,4000);
  }
  finally{syncing=false;if(again){again=false;flush()}}
}
async function refresh(force){
  if(!ME)return;
  if(!force&&pending())return;

  let d;try{d=normData(await API('data'))}catch(e){return}
  if(!force&&pending())return;
  const changed=JSON.stringify(d)!==JSON.stringify(snap);
  normData(d);db=d;snap=clone(d);keep();
  if(changed||force)render();
}

 ['Lunes · Glúteos y cuádriceps',[['Hip thrust con barra',4,'6–8','hipthrust'],['Prensa a 45°',3,'8–10','legpress'],['Sentadilla búlgara',2,'8–10 c/pierna','split'],['Abducción en máquina',3,'20','abduct']]],

 ['Miércoles · Glúteos y cadena posterior',[['Peso muerto rumano',3,'8–10','rdl'],['Sentadilla en Smith',3,'8–10','squatbb'],['Curl femoral sentado',3,'10–12','seatedcurl'],['Patada de glúteo en polea',3,'12–15 c/pierna','kick'],['Plancha lateral',3,'40 s c/lado','sideplank']]],
 ['Jueves · Tren superior y cardio',[['Press de hombros en máquina',3,'8–12','shpress'],['Remo unilateral en polea',3,'10–12','cablerow'],['Press inclinado con mancuernas',3,'8–12','incpress'],['Face pull',2,'12–20','facepull'],['Curl de bíceps',2,'10–15','cablecurl'],['Extensión de tríceps',2,'10–15','tri'],['Caminata',1,'20–25 min','']]],

function rutinaNov(){
  const mk=deload=>RUT_NOV.map(([name,ex])=>({name,exercises:ex.map(([n,sets,reps,pic],i)=>({id:uid(),name:n,sets:deload&&sets>1?sets-1:sets,reps,weight:'',pic,
    notes:deload?'Semana de descarga: bajá el peso un 20–30% y enfocate en la técnica.':n==='Caminata'?'Después de las pesas.':i<2?P1:ACC}))}));
  return Array.from({length:12},(_,w)=>w<4?{week:w+1,phase:w===3?'Deload':w===0?'Base':'Carga',days:mk(w===3)}:{week:w+1,phase:'Base',days:RUT_NOV.map(([name])=>({name,exercises:[]}))});
}
const MSG_NOV='Esta rutina se repite 3 semanas y la cuarta es de descarga. Los ejercicios 1 y 2 de cada día son los principales: ahí vas subiendo el peso. Si el rango es 6–8, usá un peso con el que hagas 8; cuando completes todas las series de 8, la semana siguiente subís. Si con el peso nuevo no llegás a 8 en todas, mantenelo hasta lograrlo. En los demás ejercicios no te exijas subir: priorizá la técnica.';
const APROX='Antes de las series: 1 serie de 8 reps con el 50–60% del peso que venís usando, después 1 serie de 4 reps con el 75–80%. Recién ahí poné tu peso de trabajo y hacé las series indicadas.';
const PREA={0:['Camilla femoral · preactivación','legcurl'],2:['Patada en polea · preactivación','kick'],4:['Extensión de cuádriceps · preactivación','legext']};
function addActivation(){
  const pls=[...db.students.filter(s=>/^(cintia|luc[ií]a)\b/i.test((s.name||'').trim())).map(s=>s.plan),...db.templates.filter(t=>t.name==='Cintia | Lucia · noviembre').map(t=>t.plan)];
  pls.forEach(pl=>pl.forEach(w=>w.days.forEach((d,di)=>{
    if(!d.exercises.length||d.exercises.some(e=>/preactivación/.test(e.name)))return;
    const f=d.exercises[0];f.notes=APROX+' '+(f.notes||'');
    if(PREA[di]&&w.days.length===5)d.exercises.unshift({id:uid(),name:PREA[di][0],sets:1,reps:'15–20',weight:'',pic:PREA[di][1],notes:'Una sola serie, peso tranqui. Controlá la bajada (fase excéntrica), aguantando el peso.'});
  })));
  save();
}
function runMigrations(){
  const c=CT(),done=c.migrations||(c.migrations=[]);
  if(!done.includes('inicio-10nov')){done.push('inicio-10nov');
    db.students.filter(s=>/^(cintia|luc[ií]a)\b/i.test((s.name||'').trim())).forEach(s=>{const st='2026-11-10';s.start=st;s.billing=s.billing||{payments:[]};s.billing.start=st;s.billing.end=addD(st,84)});save()}
  if(done.includes('rutina-nov-2026')){if(!done.includes('activacion-nov')){done.push('activacion-nov');addActivation()}return}
  done.push('rutina-nov-2026');
  db.templates.push({id:uid(),name:'Cintia | Lucia · noviembre',desc:'5 días · 3 semanas de carga progresiva + 1 de descarga',plan:rutinaNov()});
  const hit=db.students.filter(s=>/^(cintia|luc[ií]a)\b/i.test((s.name||'').trim()));
  hit.forEach(s=>{s.plan=rutinaNov();s.notes=MSG_NOV});
  done.push('activacion-nov');addActivation();
  save();
  setTimeout(()=>toast(hit.length?'Rutina nueva cargada para '+hit.map(s=>s.name).join(' y '):'Plantilla nueva lista: “Cintia | Lucia · noviembre”'),600);
}

let S={role:null,sid:null,view:'home',week:0,day:0,tab:'plan',stab:'rutina',ttab:'alumnos',tid:null,fx:null,open:{}};
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1900)}
const stu=()=>db.students.find(s=>s.id===S.sid);
function isDone(s,e){const l=s.logs[e.id];return !!(l&&l.sets&&l.sets.length>=e.sets&&l.sets.slice(0,e.sets).every(Boolean))}
function wkStats(s,w){let a=0,b=0;w.days.forEach(d=>d.exercises.forEach(e=>{a++;isDone(s,e)&&b++}));return{a,b,p:a?b/a:0}}
function totals(s){let a=0,b=0;s.plan.forEach(w=>{const t=wkStats(s,w);a+=t.a;b+=t.b});return{a,b,pct:a?Math.round(b*100/a):0}}
function curWeek(s){const i=s.plan.findIndex(w=>wkStats(s,w).p<1);return i<0?s.plan.length-1:i}
const dayDone=(s,d)=>d.exercises.length>0&&d.exercises.every(e=>isDone(s,e));
function todayIdx(s,wi){const w=s.plan[wi];return w?w.days.findIndex(d=>!dayDone(s,d)):-1}
function suggest(s,wi,di,name){
  const prev=s.plan[wi-1]; if(!prev)return null;
  const e=prev.days[di]?.exercises.find(x=>x.name===name); const l=e&&s.logs[e.id];
  if(!l||!l.kg)return null; return isDone(s,e)?Math.round(l.kg*1.025*2)/2:l.kg;
}
/* récords */
function bestBefore(s,name,wi){let b=0;s.plan.slice(0,wi).forEach(w=>w.days.forEach(d=>d.exercises.forEach(e=>{const l=s.logs[e.id];if(e.name===name&&l&&l.kg&&isDone(s,e))b=Math.max(b,l.kg)})));return b}
function isPR(s,wi,e){const l=s.logs[e.id];return !!(l&&l.pr&&isDone(s,e))}
function earnPR(s,wi,e){const l=s.logs[e.id];if(!l||!l.kg)return false;const b=bestBefore(s,e.name,wi);return b>0&&l.kg>b}
function records(s){const m={};s.plan.forEach((w,wi)=>w.days.forEach(d=>d.exercises.forEach(e=>{const l=s.logs[e.id];if(!l||!l.kg||!isDone(s,e))return;const r=m[e.name]||(m[e.name]={name:e.name,first:l.kg,best:0,wk:0});if(l.kg>r.best){r.best=l.kg;r.wk=w.week}})));
  return Object.values(m).sort((a,b)=>(b.best-b.first)-(a.best-a.first)||b.best-a.best)}
/* constancia */
const lastTrain=s=>(s.history||[]).map(h=>h.date).sort().at(-1)||null;
const monday=dstr=>{const d=new Date(dstr+'T12:00');const k=(d.getDay()+6)%7;return addD(dstr,-k)};
function weekCount(s,mon){const end=addD(mon,7);return (s.history||[]).filter(h=>h.date>=mon&&h.date<end).length}
function streakWeeks(s){let mon=monday(TODAY),n=0;if(weekCount(s,mon)>=3)n++;mon=addD(mon,-7);while(weekCount(s,mon)>=3){n++;mon=addD(mon,-7)}return n}
function monthCount(s){const p=TODAY.slice(0,7);return (s.history||[]).filter(h=>h.date.startsWith(p)).length}
/* mensajes */
const allMsgs=s=>{const out=[];s.plan.forEach((w,wi)=>w.days.forEach((d,di)=>d.exercises.forEach(e=>{const l=s.logs[e.id];(l?.msgs||[]).forEach(m=>out.push({...m,ex:e,wi,di}))})));return out};
const unseen=s=>allMsgs(s).filter(m=>m.from==='alumno'&&!m.seen);
const unseenProfe=s=>allMsgs(s).filter(m=>m.from==='profe'&&!m.seenA);
/* pagos */
function bill(s){const b=s.billing||{};const left=b.end?diffD(b.end,TODAY):null;const paid=(b.payments||[]).some(p=>p.date>=addD(b.start,-15));return{...b,left,paid}}
/* avisos */
function alerts(){
  const out=[];
  db.students.forEach(s=>{
    CT().rewards.forEach(r=>{const x=rStat(s,r);if(x.won&&!x.given)out.push({s,k:'medal',cls:'ok',t:`${s.name} ganó: ${r.prize}`,sub:rText(r)+'. Coordiná la entrega.',tab:'prog',o:1})});
    unseen(s).forEach(m=>out.push({s,k:'chat',cls:'y',t:`${s.name} comentó en ${m.ex.name}`,sub:'“'+m.text+'”',tab:'prog',o:1}));
    const lt=lastTrain(s),idle=lt?diffD(TODAY,lt):null;
    if(s.start<=TODAY&&totals(s).pct<100&&(idle==null?diffD(TODAY,s.start)>=3:idle>=5))out.push({s,k:'clock',cls:'hot',t:`${s.name} no entrena hace ${idle??diffD(TODAY,s.start)} días`,sub:lt?'Último entrenamiento: '+fdate(lt):'Todavía no empezó',tab:'prog',o:2});
    const b=bill(s);
    if(b.left!=null&&b.left<0)out.push({s,k:'money',cls:'hot',t:`El plan de ${s.name} venció hace ${-b.left} días`,sub:'Renová el plan o registrá el pago',tab:'pagos',o:0});
    else if(b.left!=null&&b.left<=7)out.push({s,k:'money',cls:'y',t:`El plan de ${s.name} vence en ${b.left} días`,sub:'Vence el '+fdate(b.end),tab:'pagos',o:3});
    if(!b.paid)out.push({s,k:'money',cls:'hot',t:`${s.name} tiene el pago pendiente`,sub:'Plan de '+money(b.price),tab:'pagos',o:1});
    const r=Object.entries(s.rpe||{}).sort((a,b)=>{const[x,y]=a[0].split('-').map(Number),[z,q]=b[0].split('-').map(Number);return x-z||y-q}).at(-1);
    if(r&&r[1]>=9){const[w,d]=r[0].split('-').map(Number);out.push({s,k:'bolt',cls:'hot',t:`${s.name} marcó esfuerzo ${r[1]}/10`,sub:`Semana ${w+1}, día ${d+1}. Revisá las cargas.`,tab:'prog',o:4})}
  });
  return out.sort((a,b)=>a.o-b.o);
}

/* ===== notificaciones (web push) e instalación ===== */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let PUSH='off',installEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;S.role&&render()});
addEventListener('appinstalled',()=>{installEv=null;S.role&&render()});
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
async function pushState(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return PUSH=isIOS&&!standalone()?'install':'unsupported';
  if(Notification.permission==='denied')return PUSH='denied';
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();PUSH=sub&&Notification.permission==='granted'?'on':'off';
    if(PUSH==='on'&&ME)API('push/subscribe',{body:{sub:sub.toJSON()}}).catch(()=>{})}catch(e){PUSH='off'}
  return PUSH;
}
async function enablePush(){
  if(PUSH==='install'){S.open.install=true;render();toast('Primero agregá la app a tu pantalla de inicio');return false}
  if(PUSH==='unsupported'){toast('Este navegador no permite notificaciones');return false}
  if(PUSH==='denied'){toast('Los avisos están bloqueados en los ajustes del celular');return false}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){PUSH=perm==='denied'?'denied':'off';render();toast('No se activaron los avisos');return false}
    const reg=await navigator.serviceWorker.ready,{key}=await API('push/key');
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    await API('push/subscribe',{body:{sub:sub.toJSON()}});
    PUSH='on';render();toast('Avisos activados');return true;
  }catch(e){console.error(e);toast('No se pudieron activar los avisos');return false}
}
async function initPush(){await pushState();S.role&&render()}

const NAV=[];
function hashFor(){
  if(!S.role)return '';
  if(S.role==='alumno'){if(S.stab==='prog')return 'progreso';if(S.stab==='med')return 'medidas';if(S.stab==='comida')return 'comida';if(S.stab==='mente')return 'mentalidad';if(S.stab==='premios')return 'premios';return S.view==='day'?`dia-${S.week+1}-${S.day+1}`:'rutina'}
  if(S.view==='tpl')return 'plantilla-'+S.tid;
  if(S.view==='student')return `alumno-${S.sid}-${S.tab}`;
  return ['plantillas','mentalidad','premios'].includes(S.ttab)?S.ttab:'alumnos';

function applyHash(h){
  let m;
  if(!ME)return;
  if(ME.role==='alumno'){
    S.role='alumno';S.sid=ME.sid;const s=stu();if(!s)return;
    S.stab={progreso:'prog',medidas:'med',comida:'comida',mentalidad:'mente',premios:'premios'}[h]||'rutina';S.view='home';
    if((m=h.match(/^dia-(\d+)-(\d+)$/))){S.week=Math.max(0,Math.min(+m[1]-1,s.plan.length-1));S.day=Math.max(0,Math.min(+m[2]-1,s.plan[S.week].days.length-1));S.view='day'}
    return}
  S.role='profe';
  if(['alumnos','plantillas','mentalidad','premios'].includes(h)){S.view='list';S.ttab=h;return}
  if((m=h.match(/^alumno-([A-Za-z0-9_-]+)-(plan|comida|prog|med|pagos|data)$/))&&db.students.find(x=>x.id===m[1])){const was=S.sid;S.view='student';S.sid=m[1];S.tab=m[2];if(was!==m[1]){S.week=curWeek(stu());S.day=0}return}
  if((m=h.match(/^plantilla-([A-Za-z0-9_-]+)$/))&&db.templates.find(x=>x.id===m[1])){S.view='tpl';S.tid=m[1];return}
  S.view='list';S.ttab='alumnos';
}
function syncHash(){const h=hashFor();if(location.hash.slice(1)!==h){if(NAV.at(-1)!==h)NAV.push(h);try{location.hash=h}catch(e){}}else if(!NAV.length)NAV.push(h)}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h===hashFor())return;if(NAV.at(-2)===h)NAV.pop();else NAV.push(h);stopRest();applyHash(h);render();scrollTo(0,0)});

/* --- premios --- */
const RT={
  weeks:{n:'Semanas seguidas entrenando',f:r=>`${r.goal} semana${r.goal>1?'s':''} seguida${r.goal>1?'s':''} entrenando ${r.per} día${r.per>1?'s':''} o más por semana`},
  total:{n:'Cantidad de entrenamientos',f:r=>`Completar ${r.goal} entrenamiento${r.goal>1?'s':''}`},
  prs:{n:'Récords personales',f:r=>`Lograr ${r.goal} récord${r.goal>1?'s':''} personal${r.goal>1?'es':''}`},
  plan:{n:'Terminar el plan de 12 semanas',f:()=>'Completar el plan de 12 semanas'},
  manual:{n:'Lo entrego yo a mano',f:r=>r.desc||'Lo otorga tu profe'}
};
const rText=r=>(RT[r.type]||RT.manual).f(r);
function weekRuns(s,per){
  const ds=[...new Set((s.history||[]).map(h=>h.date))].sort();
  if(!ds.length)return{best:0,cur:0};
  let mon=monday(ds[0]),end=monday(TODAY),run=0,best=0,cur=0;
  while(mon<=end){const n=ds.filter(d=>d>=mon&&d<addD(mon,7)).length;
    if(n>=per){run++;best=Math.max(best,run)}else if(mon<end)run=0;
    mon=addD(mon,7)}
  cur=run;return{best,cur};
}
function rStat(s,r){
  const st=s.rewards?.[r.id]||{};let cur=0,goal=Math.max(1,+r.goal||1),auto;
  if(r.type==='weeks'){const w=weekRuns(s,Math.max(1,+r.per||1));cur=w.best>=goal?goal:w.cur;auto=w.best>=goal}
  else if(r.type==='total'){cur=new Set((s.history||[]).map(h=>h.w+'-'+h.d)).size;auto=cur>=goal}
  else if(r.type==='prs'){cur=Object.values(s.logs||{}).filter(l=>l&&l.pr).length;auto=cur>=goal}
  else if(r.type==='plan'){goal=100;cur=totals(s).pct;auto=cur>=100}
  else{goal=1;cur=st.granted?1:0;auto=false}
  const won=auto||!!st.granted;
  return{cur:Math.min(cur,goal),goal,won,given:st.given||null,date:st.won||null};
}
const wonIds=s=>CT().rewards.filter(r=>rStat(s,r).won).map(r=>r.id);
function rewardCard(s,r,mode){

function spark(vals){
  const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]!=null);
  if(pts.length<1)return '<svg viewBox="0 0 240 70"><text x="0" y="40" fill="var(--mute)" font-size="12" font-family="IBM Plex Mono,monospace">Sin registros todavía</text></svg>';
  const ys=pts.map(p=>p[1]),lo=Math.min(...ys),hi=Math.max(...ys),rng=hi-lo||1;
  const X=i=>6+i*(228/11),Y=v=>60-((v-lo)/rng)*48;
  const line=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  const last=pts.at(-1);
  return `<svg viewBox="0 0 240 70" preserveAspectRatio="none">${Array.from({length:12},(_,i)=>`<line x1="${X(i)}" x2="${X(i)}" y1="8" y2="62" stroke="var(--line)" stroke-width="1"/>`).join('')}
    <polyline points="${line}" fill="none" stroke="var(--y)" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.5" fill="var(--y)"/>`).join('')}
    <circle cx="${X(last[0])}" cy="${Y(last[1])}" r="5" fill="var(--ink)" stroke="var(--y)" stroke-width="2.5"/></svg>`;
}

    ${topSeg()}
    <div class="row sp" style="align-items:flex-end"><div class="stack" style="gap:8px"><span class="lbl y">Planificaciones reutilizables</span><h1 style="font-size:clamp(48px,9vw,88px)">Plantillas <span class="mute">${db.templates.length}</span></h1></div>
      <button class="btn y" id="tp-new">${ICON.plus}Nueva plantilla</button></div>
    <div class="tpls">${db.templates.map(t=>{const n=t.plan.reduce((a,w)=>a+w.days.reduce((b,d)=>b+d.exercises.length,0),0),uses=0;return `<div class="tpl">
      <div class="nm">${esc(t.name)}</div><div class="mute" style="font-size:13px">${esc(t.desc||'')}</div>
      <div class="mini" style="height:40px">${t.plan.map(w=>`<i style="height:${Math.round((PHASES[w.phase]||PHASES.Base).h*100)}%;background:${(PHASES[w.phase]||PHASES.Base).c}"></i>`).join('')}</div>
      <div class="mute" style="font-size:13px">${t.plan.length} semanas · ${t.plan[0]?.days.length||0} días · ${n} ejercicios en total</div>
      <div class="row" style="gap:6px"><button class="btn sm y" data-te="${t.id}">Editar</button><button class="btn sm" data-td="${t.id}">${ICON.copy}Duplicar</button><button class="btn sm ghost warn" data-tx="${t.id}">Borrar</button></div>
      <div id="tx-${t.id}"></div></div>`}).join('')}</div>
    <p class="mute" style="margin:0;font-size:13px">Al crear un alumno elegís con qué plantilla arranca. Después podés ajustar su plan sin tocar la plantilla.</p>
  </div>`;
  bindSeg();
  $('#tp-new').onclick=()=>{const t={id:uid(),name:'Nueva plantilla',desc:'12 semanas × 5 días',plan:emptyPlan()};db.templates.push(t);save();Object.assign(S,{view:'tpl',tid:t.id,week:0,day:0});render();setTimeout(()=>{$('#tpl-name')?.focus();$('#tpl-name')?.select()},20)};
  $$('[data-te]').forEach(b=>b.onclick=()=>{Object.assign(S,{view:'tpl',tid:b.dataset.te,week:0,day:0});render();scrollTo(0,0)});
  $$('[data-td]').forEach(b=>b.onclick=()=>{const t=db.templates.find(x=>x.id===b.dataset.td);db.templates.push({...clone(t),id:uid(),name:t.name+' (copia)',plan:withIds(clone(t.plan))});save();render();toast('Plantilla duplicada')});
  $$('[data-tx]').forEach(b=>b.onclick=()=>{const id=b.dataset.tx;$('#tx-'+id).innerHTML=`<div class="confirm"><span>¿Borrar la plantilla? Los alumnos que ya la usan no cambian.</span><button class="btn sm warn" data-ty="${id}">Borrar</button></div>`;
    $(`[data-ty="${id}"]`).onclick=()=>{db.templates=db.templates.filter(t=>t.id!==id);save();render();toast('Plantilla borrada')}});
}
function tplEdit(){
  const t=db.templates.find(x=>x.id===S.tid);t.logs=t.logs||{};
  $('#app').innerHTML=`<div class="stack" style="gap:22px">
    <button class="btn sm ghost" id="back" style="align-self:flex-start">${ICON.back}Plantillas</button>
    <div class="stack" style="gap:6px"><span class="lbl y">Plantilla</span><input class="tplname" id="tpl-name" value="${esc(t.name)}" aria-label="Nombre de la plantilla">
      <input id="tpl-desc" value="${esc(t.desc||'')}" placeholder="Descripción corta" aria-label="Descripción" style="background:transparent;border:0;color:var(--mute);padding:0;font-size:14px"></div>
    <div id="tb"></div></div>`;
  $('#back').onclick=()=>goBack(()=>{S.view='list';S.ttab='plantillas'});
  $('#tpl-name').onchange=e=>{t.name=e.target.value.trim()||'Plantilla';save();toast('Nombre guardado')};
  $('#tpl-desc').onchange=e=>{t.desc=e.target.value.trim();save()};
  planEditor(t,true);
}
async function boot(){
  $('#app').innerHTML='<p class="mute" style="padding:40px 0">Cargando…</p>';
  const c=cached();
  if(!navigator.onLine&&c){ME=c.me;db=normData(c.db);snap=normData(c.snap);enter(ME);try{if(location.hash.length>1)applyHash(location.hash.slice(1))}catch(e){}render();toast('Sin conexión: lo que anotes se guarda cuando vuelva internet');return}
  try{const r=await API('me');ME=r.user;NEEDS_SETUP=r.needsSetup;if(ME){await loadData();enter(ME)}}
  catch(e){if(e.status!==401&&c){ME=c.me;db=normData(c.db);snap=normData(c.snap);enter(ME);try{if(location.hash.length>1)applyHash(location.hash.slice(1))}catch(x){}render();toast('Sin conexión: lo que anotes se guarda cuando vuelva internet');return}if(e.status===401)return;$('#app').innerHTML=`<div class="stack" style="padding:40px 0"><h1>Sin conexión</h1><p class="mute">No pudimos conectar con la app. Revisá internet y probá de nuevo.</p><button class="btn y" onclick="location.reload()" style="align-self:flex-start">Reintentar</button></div>`;return}
  try{if(location.hash.length>1)applyHash(location.hash.slice(1))}catch(e){}
  render();
  if(ME)initPush();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
boot();
</script>
</body>
</html>
